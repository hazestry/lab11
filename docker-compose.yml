services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - swipeheart_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hazestry} -d ${POSTGRES_DB:-swipeheart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: ["/app/entrypoint.sh"]

    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - swipeheart_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  swipeheart_network:
    driver: bridge
    name: swipeheart_network 
